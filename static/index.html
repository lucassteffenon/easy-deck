<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>MacroDeck</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #0a0a0f;
  --surface: #111118;
  --surface2: #16161f;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #e8e8f0;
  --text-muted: #e8e8f0;
  --text-dim: #3a3a52;
  --accent: #6c63ff;
  --accent-glow: rgba(108,99,255,0.3);
  --accent-dim: rgba(108,99,255,0.12);
  --success: #22c55e;
  --danger: #ef4444;
  --warn: #f59e0b;
  --r: 14px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Syne', sans-serif;
  overscroll-behavior: none;
}

/* ─── Screens ───────────────────────────────────────── */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.screen.hidden { display: none; }

/* ─── Connect screen ────────────────────────────────── */
#screen-connect {
  align-items: center;
  justify-content: center;
  gap: 0;
  padding: 32px 24px;
  padding-top: calc(var(--safe-top) + 32px);
}
.connect-logo {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}
.connect-logo span { color: var(--accent); }
.connect-sub {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 40px;
  font-family: 'JetBrains Mono', monospace;
}
.connect-card {
  width: 100%;
  max-width: 360px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.connect-label {
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 4px;
}
.connect-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 10px;
  color: var(--text);
  font-size: 16px;
  padding: 12px 14px;
  font-family: 'JetBrains Mono', monospace;
  outline: none;
  transition: border-color 0.15s;
}
.connect-input:focus { border-color: var(--accent); }
.connect-btn {
  width: 100%;
  padding: 14px;
  background: var(--accent);
  border: none;
  border-radius: 10px;
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  font-family: 'Syne', sans-serif;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.connect-btn:active { opacity: 0.8; transform: scale(0.98); }
.connect-status {
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
  text-align: center;
  padding: 10px;
  border-radius: 8px;
  display: none;
}
.connect-status.ok { background: rgba(34,197,94,0.12); color: var(--success); display: block; }
.connect-status.err { background: rgba(239,68,68,0.12); color: var(--danger); display: block; }
.connect-hint {
  font-size: 11px;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  text-align: center;
  line-height: 1.6;
}

/* ─── Deck screen ───────────────────────────────────── */
#screen-deck {
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}

/* ─── Header ────────────────────────────────────────── */
#deck-header {
  padding: 12px 16px 0;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.header-logo {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.01em;
}
.header-logo span { color: var(--accent); }
.header-host {
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-dim);
  flex: 1;
}
.header-conn-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--success);
  flex-shrink: 0;
}
.header-conn-dot.offline { background: var(--danger); }

/* ─── Page tabs ─────────────────────────────────────── */
#page-tabs {
  display: flex;
  gap: 6px;
  padding: 12px 16px 8px;
  overflow-x: auto;
  flex-shrink: 0;
  scrollbar-width: none;
}
#page-tabs::-webkit-scrollbar { display: none; }
.page-tab {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  border: 1px solid var(--border);
  color: var(--text-muted);
  background: none;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.page-tab.active {
  background: var(--accent-dim);
  border-color: rgba(108,99,255,0.3);
  color: var(--accent);
}
.page-tab-add {
  flex-shrink: 0;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 14px;
  border: 1px dashed var(--border);
  color: var(--text-dim);
  background: none;
  cursor: pointer;
}

/* ─── Button grid ───────────────────────────────────── */
#btn-grid {
  flex: 1 1 0;
  min-height: 0;
  width: 100%;
  overflow-y: auto;
  padding: 10px 12px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
  align-content: start;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

@media (orientation: landscape) and (max-height: 520px) {
  #btn-grid {
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 7px;
    padding: 6px 10px;
  }
  .btn-icon { font-size: 26px; }
  .btn-label { font-size: 10px; }
  #deck-header { padding: 6px 16px 0; }
  #page-tabs { padding: 6px 16px 4px; }
}
#btn-grid::-webkit-scrollbar { display: none; }

.deck-btn {
  aspect-ratio: 1;
  border-radius: var(--r);
  border: 1px solid rgba(255,255,255,0.07);
  background: var(--btn-bg, var(--surface2));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.1s, border-color 0.2s;
  -webkit-user-select: none;
  user-select: none;
}

.deck-btn:active { transform: scale(0.91); }

/* Feedback de execução */
.deck-btn::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 0;
  transition: none;
}
.deck-btn.running::after {
  height: 3px;
  background: var(--accent);
  animation: progress 0.6s ease-out forwards;
}
@keyframes progress {
  from { width: 0; }
  to { width: 100%; }
}
.deck-btn.ok-flash { border-color: var(--success) !important; }
.deck-btn.err-flash { border-color: var(--danger) !important; }

/* Long press indicator */
.deck-btn.pressing {
  transform: scale(0.93);
  border-color: rgba(108,99,255,0.5);
  transition: transform 0.4s ease, border-color 0.4s ease;
}

.btn-icon { font-size: 40px; line-height: 1; pointer-events: none; }
.btn-label {
  font-size: 13px;
  font-weight: 600;
  color: rgba(255,255,255,0.80);
  text-align: center;
  padding: 0 8px;
  line-height: 1.3;
  pointer-events: none;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.btn-type-badge {
  position: absolute;
  top: 5px; right: 5px;
  font-size: 7px;
  font-family: 'JetBrains Mono', monospace;
  color: rgba(255,255,255,0.2);
  text-transform: uppercase;
}

/* Add button */
.deck-btn-add {
  aspect-ratio: 1;
  border-radius: var(--r);
  border: 1px dashed var(--border2);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  transition: border-color 0.15s;
  background: none;
}
.deck-btn-add:active { background: var(--surface2); }
.deck-btn-add-icon { font-size: 22px; color: var(--text-dim); }
.deck-btn-add-text { font-size: 9px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }

/* ─── Toast ─────────────────────────────────────────── */
#toast {
  position: fixed;
  bottom: calc(20px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 10px 20px;
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-muted);
  z-index: 200;
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  white-space: nowrap;
  max-width: 90vw;
  overflow: hidden;
  text-overflow: ellipsis;
}
#toast.show { transform: translateX(-50%) translateY(0); }
#toast.ok { color: var(--success); border-color: rgba(34,197,94,0.3); }
#toast.err { color: var(--danger); border-color: rgba(239,68,68,0.3); }

/* ─── Bottom sheet (editor) ─────────────────────────── */
#sheet-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 100;
  display: none;
  align-items: flex-end;
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}
#sheet-overlay.open { display: flex; }
#sheet {
  width: 100%;
  max-height: 88vh;
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  border-top: 1px solid var(--border2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
  padding-bottom: var(--safe-bottom);
}
#sheet-overlay.open #sheet { transform: translateY(0); }
.sheet-handle {
  width: 36px; height: 4px;
  background: var(--border2);
  border-radius: 2px;
  margin: 12px auto 0;
  flex-shrink: 0;
}
.sheet-title {
  font-size: 16px;
  font-weight: 700;
  padding: 12px 20px 8px;
  flex-shrink: 0;
}
.sheet-body {
  overflow-y: auto;
  padding: 4px 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  -webkit-overflow-scrolling: touch;
}
.sheet-body::-webkit-scrollbar { display: none; }

.field-label {
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 6px;
}
.field-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 10px;
  color: var(--text);
  font-size: 15px;
  padding: 11px 14px;
  font-family: 'Syne', sans-serif;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color 0.15s;
}
.field-input:focus { border-color: var(--accent); }
.field-input.mono { font-family: 'JetBrains Mono', monospace; font-size: 13px; }
select.field-input { cursor: pointer; }
textarea.field-input { resize: none; min-height: 80px; line-height: 1.5; }

.icon-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 4px;
  margin-bottom: 8px;
}
.icon-opt {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  border-radius: 8px;
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: all 0.1s;
  background: none;
}
.icon-opt:active { background: var(--surface2); }
.icon-opt.selected { border-color: var(--accent); background: var(--accent-dim); }

.color-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.color-swatch {
  width: 40px; height: 40px;
  border-radius: 10px;
  border: 1px solid var(--border2);
  overflow: hidden;
  flex-shrink: 0;
  position: relative;
}
.color-swatch input[type="color"] {
  position: absolute;
  inset: -4px;
  width: calc(100% + 8px);
  height: calc(100% + 8px);
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
}
.color-presets {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.color-dot {
  width: 28px; height: 28px;
  border-radius: 8px;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.1);
  flex-shrink: 0;
  transition: transform 0.1s;
}
.color-dot:active { transform: scale(1.2); }

.action-hint {
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-muted);
  background: var(--surface2);
  border-radius: 8px;
  padding: 10px 12px;
  line-height: 1.8;
  white-space: pre-wrap;
}

.sheet-actions {
  display: flex;
  gap: 8px;
  padding: 12px 20px 4px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.sheet-btn {
  flex: 1;
  padding: 13px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  font-family: 'Syne', sans-serif;
  cursor: pointer;
  border: 1px solid var(--border2);
  background: none;
  color: var(--text-muted);
  transition: all 0.15s;
}
.sheet-btn:active { opacity: 0.7; }
.sheet-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.sheet-btn.danger { color: var(--danger); border-color: rgba(239,68,68,0.2); }
.sheet-btn.danger:active { background: rgba(239,68,68,0.1); }
</style>
</head>
<body>

<!-- ─── Connect screen ─────────────────────────────── -->
<div id="screen-connect" class="screen">
  <div class="connect-logo">Macro<span>Deck</span></div>
  <div class="connect-sub">controle remoto do seu PC</div>

  <div class="connect-card">
    <div>
      <div class="connect-label">Endereço do servidor</div>
      <input class="connect-input" id="server-url" type="url"
        placeholder="http://192.168.1.100:7777"
        inputmode="url" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <button class="connect-btn" onclick="tryConnect()">
      <span>Conectar</span>
    </button>
    <div class="connect-status" id="connect-status"></div>
    <div class="connect-hint">
      Rode server.py no seu PC.<br>
      O IP aparece no terminal ao iniciar.
    </div>
  </div>
</div>

<!-- ─── Deck screen ────────────────────────────────── -->
<div id="screen-deck" class="screen hidden">
  <div id="deck-header">
    <div class="header-logo">Macro<span>Deck</span></div>
    <div class="header-host" id="header-host"></div>
    <div class="header-conn-dot" id="conn-dot"></div>
  </div>

  <div id="page-tabs"></div>

  <div id="btn-grid"></div>
</div>

<!-- ─── Bottom sheet editor ───────────────────────── -->
<div id="sheet-overlay" onclick="closeSheetOverlay(event)">
  <div id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheet-title">Editar botão</div>
    <div class="sheet-body">
      <div>
        <div class="field-label">Ícone</div>
        <div class="icon-grid" id="icon-grid"></div>
        <input class="field-input" id="ed-icon" placeholder="Emoji personalizado..."
          oninput="setIconCustom(this.value)">
      </div>
      <div>
        <div class="field-label">Label</div>
        <input class="field-input" id="ed-label" placeholder="Nome do botão">
      </div>
      <div>
        <div class="field-label">Cor</div>
        <div class="color-row">
          <div class="color-swatch" id="color-swatch">
            <input type="color" id="ed-color" value="#16161f" oninput="onColorChange(this.value)">
          </div>
          <div class="color-presets" id="color-presets"></div>
        </div>
      </div>
      <div>
        <div class="field-label">Tipo de ação</div>
        <select class="field-input" id="ed-type" onchange="onTypeChange()">
          <option value="none">Nenhuma</option>
          <option value="script">Script / Comando shell</option>
          <option value="hotkey">Tecla de atalho</option>
          <option value="app">Abrir aplicativo</option>
          <option value="url">Abrir URL</option>
          <option value="media">Controle de mídia</option>
          <option value="obs">OBS WebSocket</option>
          <option value="spotify">Spotify (Linux)</option>
        </select>
      </div>
      <div id="value-group">
        <div class="field-label">Valor</div>
        <textarea class="field-input mono" id="ed-value" rows="2" placeholder="..."></textarea>
        <div class="action-hint" id="action-hint"></div>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="sheet-btn danger" onclick="deleteBtn()">Excluir</button>
      <button class="sheet-btn" onclick="closeSheet()">Cancelar</button>
      <button class="sheet-btn primary" onclick="saveBtn()">Salvar</button>
    </div>
  </div>
</div>

<!-- ─── Toast ─────────────────────────────────────── -->
<div id="toast"></div>

<script>
// ─── State ──────────────────────────────────────────
let serverUrl = ''
let config = { pages: [], currentPage: '' }
let currentPageId = ''
let editingId = null
let editIcon = '⚡'
let lpTimer = null
let lpFired = false

const ICONS = ['💻','🌐','🔊','🔇','🎵','🎬','🔴','📸','🔒','⚡','🚀','📋','📁','💾','🖥','⌨','🖱','📡','🔧','🎮','🎯','📊','📈','🔔','💬','✉','🏠','⭐','❤','🔥','🌙','☀','🎉','🤖','👾','🛡','⚙','🔑','🗑','➕','⏯','⏭','⏮','🔁','🔀']

const COLOR_PRESETS = ['#1a1a2e','#0d1b2a','#1a2e1a','#2e1a1a','#2e2a0a','#0a1a2e','#0a2e0a','#1a0a2e','#2e1a2e','#0f1923','#1f2937','#1e1b4b','#172554','#14532d','#1c1917']

const ACTION_HINTS = {
  none: '',
  script: 'Ex:\necho "hello world"\npython3 /home/user/script.py\nnpm run build',
  hotkey: 'Linux (xdotool): ctrl+c  super+l  XF86AudioPlay\nWindows: ^c  {F5}  +{F4}',
  app: 'Linux: firefox  gedit  code\nWindows: notepad  calc  chrome\nmacOS: Safari  Terminal',
  url: 'Ex: https://github.com',
  media: 'Valores: play_pause  next_track  prev_track\nvolume_up  volume_down  mute',
  obs: 'Ex: StartRecording  StopRecording\nSetCurrentScene:Cena 1',
  spotify: 'Valores: play  pause  next  prev\n(Requer Spotify aberto no Linux)',
}

// ─── Init ────────────────────────────────────────────
function init() {
  buildIconGrid()
  buildColorPresets()
  setupLongPress()
  const saved = localStorage.getItem('macrodeck-server')
  if (saved) document.getElementById('server-url').value = saved
  document.getElementById('server-url').addEventListener('keydown', e => {
    if (e.key === 'Enter') tryConnect()
  })
}

// ─── Connect ─────────────────────────────────────────
async function tryConnect() {
  const input = document.getElementById('server-url').value.trim()
  const url = input.endsWith('/') ? input.slice(0, -1) : input
  if (!url) return

  const status = document.getElementById('connect-status')
  status.textContent = 'Conectando...'
  status.className = 'connect-status ok'
  status.style.display = 'block'

  try {
    const res = await fetch(`${url}/api/config`, { signal: AbortSignal.timeout(5000) })
    if (!res.ok) throw new Error('Servidor retornou ' + res.status)
    config = await res.json()
    serverUrl = url
    localStorage.setItem('macrodeck-server', url)
    status.textContent = '✓ Conectado!'
    currentPageId = config.currentPage || config.pages[0]?.id
    setTimeout(() => goToDeck(), 600)
  } catch (e) {
    status.textContent = '✗ ' + (e.message || 'Não foi possível conectar')
    status.className = 'connect-status err'
  }
}

function goToDeck() {
  document.getElementById('screen-connect').classList.add('hidden')
  document.getElementById('screen-deck').classList.remove('hidden')
  const sys = document.getElementById('header-host')
  sys.textContent = serverUrl.replace('http://', '')
  renderDeck()
  startHeartbeat()
}

// ─── Heartbeat ───────────────────────────────────────
async function startHeartbeat() {
  const dot = document.getElementById('conn-dot')
  setInterval(async () => {
    try {
      await fetch(`${serverUrl}/api/system`, { signal: AbortSignal.timeout(2000) })
      dot.className = 'header-conn-dot'
    } catch {
      dot.className = 'header-conn-dot offline'
    }
  }, 5000)
}

// ─── Render ──────────────────────────────────────────
function renderDeck() {
  renderTabs()
  renderGrid()
}

function currentPage() {
  return config.pages.find(p => p.id === currentPageId) || config.pages[0]
}

function renderTabs() {
  const tabs = document.getElementById('page-tabs')
  tabs.innerHTML = config.pages.map(p => `
    <button class="page-tab ${p.id === currentPageId ? 'active' : ''}"
      onclick="switchPage('${p.id}')">${p.name}</button>
  `).join('') + `<button class="page-tab-add" onclick="addPage()">+</button>`
}

function renderGrid() {
  const grid = document.getElementById('btn-grid')
  const page = currentPage()
  if (!page) return

  grid.innerHTML = page.buttons.map(btn => `
    <div class="deck-btn" id="dbtn-${btn.id}" data-id="${btn.id}"
      style="--btn-bg: ${btn.color || '#16161f'}">
      <div class="btn-icon">${btn.icon || '⚡'}</div>
      <div class="btn-label">${btn.label || ''}</div>
      <div class="btn-type-badge">${btn.action?.type || ''}</div>
    </div>
  `).join('') + `
    <div class="deck-btn-add" onclick="addBtn()">
      <div class="deck-btn-add-icon">＋</div>
      <div class="deck-btn-add-text">novo</div>
    </div>
  `
}

function switchPage(id) {
  currentPageId = id
  renderDeck()
}

function addPage() {
  const name = prompt('Nome da nova página:')
  if (!name) return
  const id = 'p_' + Date.now()
  config.pages.push({ id, name, buttons: [] })
  currentPageId = id
  renderDeck()
  saveConfig()
}

// ─── Execute ─────────────────────────────────────────
async function executeBtn(id) {
  navigator.vibrate?.(30)
  const page = currentPage()
  const btn = page?.buttons.find(b => b.id === id)
  if (!btn) return
  const el = document.getElementById(`dbtn-${id}`)

  el?.classList.add('running')
  try {
    const res = await fetch(`${serverUrl}/api/execute`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: btn.action }),
      signal: AbortSignal.timeout(12000)
    })
    const data = await res.json()
    el?.classList.remove('running')
    el?.classList.add(data.ok ? 'ok-flash' : 'err-flash')
    setTimeout(() => el?.classList.remove('ok-flash', 'err-flash'), 1000)
    toast(data.output?.slice(0, 80) || 'OK', data.ok ? 'ok' : 'err')
  } catch (e) {
    el?.classList.remove('running')
    el?.classList.add('err-flash')
    setTimeout(() => el?.classList.remove('err-flash'), 1000)
    toast('Erro: ' + e.message, 'err')
  }
}

// ─── Long press ──────────────────────────────────────
function setupLongPress() {
  const grid = document.getElementById('btn-grid')

  grid.addEventListener('touchstart', e => {
    const btn = e.target.closest('.deck-btn[data-id]')
    if (!btn) return
    lpFired = false
    btn.classList.add('pressing')
    lpTimer = setTimeout(() => {
      lpFired = true
      btn.classList.remove('pressing')
      navigator.vibrate?.(60)
      openEditor(btn.dataset.id)
    }, 500)
  }, { passive: true })

  const cancel = e => {
    clearTimeout(lpTimer)
    e.target.closest?.('.deck-btn[data-id]')?.classList.remove('pressing')
  }
  grid.addEventListener('touchmove', cancel, { passive: true })
  grid.addEventListener('touchcancel', cancel, { passive: true })

  grid.addEventListener('touchend', e => {
    clearTimeout(lpTimer)
    const btn = e.target.closest('.deck-btn[data-id]')
    if (!btn) return
    btn.classList.remove('pressing')
    if (lpFired) return
    e.preventDefault()
    executeBtn(btn.dataset.id)
  }, { passive: false })

  // desktop fallback
  grid.addEventListener('click', e => {
    if (lpFired) { lpFired = false; return }
    const btn = e.target.closest('.deck-btn[data-id]')
    if (btn) executeBtn(btn.dataset.id)
  })
  grid.addEventListener('contextmenu', e => {
    const btn = e.target.closest('.deck-btn[data-id]')
    if (!btn) return
    e.preventDefault()
    openEditor(btn.dataset.id)
  })
}

// ─── Editor (bottom sheet) ───────────────────────────
function addBtn() {
  const page = currentPage()
  if (!page) return
  const id = 'b_' + Date.now()
  page.buttons.push({ id, label: 'Novo', icon: '⚡', color: '#16161f', action: { type: 'none', value: '' } })
  renderGrid()
  openEditor(id)
}

function openEditor(id) {
  const page = currentPage()
  const btn = page?.buttons.find(b => b.id === id)
  if (!btn) return
  editingId = id
  editIcon = btn.icon || '⚡'
  document.getElementById('ed-label').value = btn.label || ''
  document.getElementById('ed-icon').value = btn.icon || ''
  document.getElementById('ed-color').value = btn.color || '#16161f'
  document.getElementById('color-swatch').style.background = btn.color || '#16161f'
  document.getElementById('ed-type').value = btn.action?.type || 'none'
  document.getElementById('ed-value').value = btn.action?.value || ''
  onTypeChange()
  updateIconSelection()
  document.getElementById('sheet-overlay').classList.add('open')
}

function closeSheet() {
  document.getElementById('sheet-overlay').classList.remove('open')
  editingId = null
}

function closeSheetOverlay(e) {
  if (e.target === document.getElementById('sheet-overlay')) closeSheet()
}

function saveBtn() {
  if (!editingId) return
  const page = currentPage()
  const btn = page?.buttons.find(b => b.id === editingId)
  if (!btn) return
  btn.icon = editIcon
  btn.label = document.getElementById('ed-label').value
  btn.color = document.getElementById('ed-color').value
  btn.action = {
    type: document.getElementById('ed-type').value,
    value: document.getElementById('ed-value').value
  }
  closeSheet()
  renderGrid()
  saveConfig()
  toast('Botão salvo!', 'ok')
}

function deleteBtn() {
  if (!editingId || !confirm('Excluir este botão?')) return
  const page = currentPage()
  if (!page) return
  page.buttons = page.buttons.filter(b => b.id !== editingId)
  closeSheet()
  renderGrid()
  saveConfig()
}

function onTypeChange() {
  const type = document.getElementById('ed-type').value
  document.getElementById('action-hint').textContent = ACTION_HINTS[type] || ''
}

// ─── Color ───────────────────────────────────────────
function onColorChange(val) {
  document.getElementById('color-swatch').style.background = val
}

function buildColorPresets() {
  document.getElementById('color-presets').innerHTML = COLOR_PRESETS.map(c =>
    `<div class="color-dot" style="background:${c}" onclick="pickColor('${c}')"></div>`
  ).join('')
}

function pickColor(c) {
  document.getElementById('ed-color').value = c
  document.getElementById('color-swatch').style.background = c
}

// ─── Icon ────────────────────────────────────────────
function buildIconGrid() {
  document.getElementById('icon-grid').innerHTML = ICONS.map(i =>
    `<button class="icon-opt" onclick="pickIcon('${i}')">${i}</button>`
  ).join('')
}

function pickIcon(icon) {
  editIcon = icon
  document.getElementById('ed-icon').value = icon
  updateIconSelection()
}

function setIconCustom(val) {
  if (val.trim()) { editIcon = val.trim(); updateIconSelection() }
}

function updateIconSelection() {
  document.querySelectorAll('.icon-opt').forEach(el => {
    el.classList.toggle('selected', el.textContent === editIcon)
  })
}

// ─── Save config ─────────────────────────────────────
async function saveConfig() {
  try {
    await fetch(`${serverUrl}/api/config`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(config)
    })
  } catch (e) {
    toast('Erro ao salvar: ' + e.message, 'err')
  }
}

// ─── Toast ───────────────────────────────────────────
let toastTimer = null
function toast(msg, type = 'info') {
  const el = document.getElementById('toast')
  el.textContent = msg
  el.className = `show ${type}`
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500)
}

init()
</script>
</body>
</html>
